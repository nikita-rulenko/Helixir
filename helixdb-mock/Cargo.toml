[package]
name = "helixdb-mock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic HelixDB v2 protocol emulator for Helixir differential testing"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "helixdb_mock"
path = "src/lib.rs"

[[bin]]
name = "helixdb-mock"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
