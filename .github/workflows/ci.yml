name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Reduce link/codegen pressure on CI runners.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: |
          cargo fmt --manifest-path helixir/Cargo.toml --all -- --check
          cargo fmt --manifest-path helixir-client/Cargo.toml --all -- --check
          cargo fmt --manifest-path helixdb-mock/Cargo.toml --all -- --check

  docs-lint:
    name: docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # #85: catches stale landing-page links/anchors, malformed Mermaid,
      # wrong schema/tool counts, removed contracts, and releases without an
      # upgrade note. Milliseconds, no dependencies.
      - name: docs lint
        run: python3 .github/scripts/docs_lint.py

  memory-boundary-contract:
    name: HelixDB emulator and memory harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixdb-mock
          key: helixdb-mock
      - name: Verify bounded emulator and fail-closed harness
        run: |
          make check-memory-boundary
          make test-helixdb-fork

  packaging:
    name: package-manager contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils binutils dpkg-dev gnupg ruby
      - name: Build deterministic fixture archive
        run: |
          mkdir -p fixture/schema fixture/skills/helixir-memory fixture/integration \
            client-fixture/skills/helixir-memory client-fixture/integration \
            packages-a packages-b packages-arm packages-old packages-index packages-missing \
            client-a client-b client-arm client-contaminated
          printf '#!/bin/sh\nprintf "helixir 9.9.9\\n"\n' > fixture/helixir
          printf '#!/bin/sh\nprintf "helixir-mcp 9.9.9\\n"\n' > fixture/helixir-mcp
          printf '#!/bin/sh\nprintf "helixir-deploy 9.9.9\\n"\n' > fixture/helixir-deploy
          printf '#!/bin/sh\nprintf "helixir-client 9.9.9\\n"\n' > fixture/helixir-client
          chmod 0755 fixture/helixir fixture/helixir-mcp fixture/helixir-deploy fixture/helixir-client
          touch fixture/schema/schema.hx fixture/schema/queries.hx fixture/helix.toml
          touch fixture/skills/helixir-memory/SKILL.md
          touch fixture/integration/AGENTS.md fixture/integration/SKILLS.md
          tar -C fixture -czf helixir-fixture-missing-backend.tar.gz .
          printf '%s\n' '{"format_version":1,"image":"ghcr.io/example/helixir-helixdb@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' \
            > fixture/backend-image.json
          tar -C fixture -czf helixir-fixture.tar.gz .
          cp fixture/helixir-client client-fixture/
          cp fixture/skills/helixir-memory/SKILL.md client-fixture/skills/helixir-memory/
          cp fixture/integration/AGENTS.md fixture/integration/SKILLS.md client-fixture/integration/
          tar -C client-fixture -czf helixir-client-fixture.tar.gz .
          touch client-fixture/skills/helixir-memory/._SKILL.md client-fixture/integration/.DS_Store
          tar -C client-fixture -czf helixir-client-macos-fixture.tar.gz .
          rm client-fixture/skills/helixir-memory/._SKILL.md client-fixture/integration/.DS_Store
          cp fixture/backend-image.json client-fixture/
          tar -C client-fixture -czf helixir-client-contaminated-fixture.tar.gz .
          rm client-fixture/backend-image.json
          printf '#!/bin/sh\nprintf "helixir 9.9.8\\n"\n' > fixture/helixir
          tar -C fixture -czf helixir-fixture-old.tar.gz .
          sha=$(sha256sum helixir-fixture.tar.gz | awk '{print $1}')
          for asset in helixir-macos-arm64.tar.gz helixir-macos-x86_64.tar.gz \
            helixir-linux-arm64.tar.gz helixir-linux-x86_64.tar.gz; do
            printf '%s  %s\n' "$sha" "$asset" >> SHA256SUMS
          done
          client_sha=$(sha256sum helixir-client-fixture.tar.gz | awk '{print $1}')
          for asset in helixir-client-macos-arm64.tar.gz helixir-client-macos-x86_64.tar.gz \
            helixir-client-linux-arm64.tar.gz helixir-client-linux-x86_64.tar.gz; do
            printf '%s  %s\n' "$client_sha" "$asset" >> SHA256SUMS
          done
      - name: Validate Homebrew rendering
        run: |
          tools/render_homebrew_formula.py --tag v9.9.9 --checksums SHA256SUMS \
            --output Formula/helixir.rb
          ruby -c Formula/helixir.rb
          grep -q '^  version "9.9.9"' Formula/helixir.rb
          ! grep -q 'bin.install_symlink libexec/"helixir-client"' Formula/helixir.rb
          grep -q 'assert_path_exists libexec/"backend-image.json"' Formula/helixir.rb
          tools/render_homebrew_formula.py --tag v9.9.9 --checksums SHA256SUMS \
            --package helixir-client --output Formula/helixir-client.rb
          ruby -c Formula/helixir-client.rb
          grep -q '^  version "9.9.9"' Formula/helixir-client.rb
          grep -q 'class HelixirClient < Formula' Formula/helixir-client.rb
          grep -q 'helixir-client-macos-arm64.tar.gz' Formula/helixir-client.rb
          grep -q 'refute_path_exists libexec/"backend-image.json"' \
            Formula/helixir-client.rb
          tools/render_homebrew_formula.py --tag v9.9.9 --checksums SHA256SUMS \
            --base-url file:///tmp/helixir-assets --output Formula/helixir-local.rb
          grep -q 'file:///tmp/helixir-assets/helixir-macos-arm64.tar.gz' \
            Formula/helixir-local.rb
          grep -q '^  version "9.9.9"' Formula/helixir-local.rb
          tools/render_homebrew_formula.py --tag v9.9.9 --checksums SHA256SUMS \
            --package helixir-client --base-url file:///tmp/helixir-assets \
            --output Formula/helixir-client-local.rb
          grep -q 'file:///tmp/helixir-assets/helixir-client-macos-arm64.tar.gz' \
            Formula/helixir-client-local.rb
          grep -q '^  version "9.9.9"' Formula/helixir-client-local.rb
          if tools/render_homebrew_formula.py --tag v9.9.9 --checksums SHA256SUMS \
            --base-url http://insecure.invalid --output Formula/insecure.rb; then
            exit 1
          fi
          tools/check_glibc_baseline.sh --max 99.99 /bin/sh
      - name: Validate deterministic Debian packages
        env:
          SOURCE_DATE_EPOCH: 1
        run: |
          tools/build_deb.sh --archive helixir-fixture.tar.gz --version 9.9.9 \
            --arch amd64 --output packages-a
          tools/build_deb.sh --archive helixir-fixture.tar.gz --version 9.9.9 \
            --arch amd64 --output packages-b
          tools/build_deb.sh --archive helixir-fixture.tar.gz --version 9.9.9 \
            --arch arm64 --output packages-arm
          tools/build_deb.sh --archive helixir-fixture-old.tar.gz --version 9.9.8 \
            --arch amd64 --output packages-old
          if tools/build_deb.sh --archive helixir-fixture-missing-backend.tar.gz \
            --version 9.9.9 --arch amd64 --output packages-missing; then
            echo 'server archive without backend-image.json unexpectedly produced a package' >&2
            exit 1
          fi
          tools/build_client_deb.sh --archive helixir-client-fixture.tar.gz --version 9.9.9 \
            --arch amd64 --output client-a
          tools/build_client_deb.sh --archive helixir-client-fixture.tar.gz --version 9.9.9 \
            --arch amd64 --output client-b
          tools/build_client_deb.sh --archive helixir-client-macos-fixture.tar.gz --version 9.9.9 \
            --arch arm64 --output client-arm
          if tools/build_client_deb.sh --archive helixir-client-contaminated-fixture.tar.gz \
            --version 9.9.9 --arch amd64 --output client-contaminated; then
            echo 'contaminated client archive unexpectedly produced a package' >&2
            exit 1
          fi
          test "$(sha256sum packages-a/*.deb | awk '{print $1}')" = \
            "$(sha256sum packages-b/*.deb | awk '{print $1}')"
          dpkg-deb --info packages-a/*.deb
          test "$(dpkg-deb --field packages-a/*.deb Architecture)" = amd64
          test "$(dpkg-deb --field packages-arm/*.deb Architecture)" = arm64
          test "$(sha256sum client-a/*.deb | awk '{print $1}')" = \
            "$(sha256sum client-b/*.deb | awk '{print $1}')"
          test "$(dpkg-deb --field client-a/*.deb Package)" = helixir-client
          test "$(dpkg-deb --field client-arm/*.deb Architecture)" = arm64
          dpkg-deb --extract packages-a/*.deb extracted
          test "$(extracted/usr/bin/helixir --version)" = 'helixir 9.9.9'
          test -f extracted/usr/lib/helixir/backend-image.json
          dpkg-deb --extract client-a/*.deb extracted-client
          test "$(extracted-client/usr/bin/helixir-client --version)" = 'helixir-client 9.9.9'
          test ! -e extracted-client/usr/lib/helixir-client/backend-image.json
          test ! -e extracted-client/usr/lib/helixir-client/helixir-mcp
          test ! -e extracted-client/usr/lib/helixir-client/schema
          dpkg-deb --extract client-arm/*.deb extracted-client-arm
          test -z "$(find extracted-client-arm -type f \
            \( -name '._*' -o -name '.DS_Store' \) -print -quit)"
      - name: Validate signed APT repository
        run: |
          export GNUPGHOME=$RUNNER_TEMP/helixir-package-test-gpg
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key \
            'Helixir CI package fixture <ci@example.invalid>' rsa2048 sign 1d
          key=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" {print $5; exit}')
          cp packages-a/*.deb packages-arm/*.deb packages-old/*.deb \
            client-a/*.deb client-arm/*.deb packages-index/
          tools/build_apt_repository.sh --packages packages-index \
            --output apt-site --signing-key "$key"
          gpgv --keyring apt-site/helixir-archive-keyring.gpg \
            apt-site/dists/stable/InRelease
          cp apt-site/dists/stable/InRelease tampered-InRelease
          sed -i 's/Helixir signed/Helixor signed/' tampered-InRelease
          if gpgv --keyring apt-site/helixir-archive-keyring.gpg tampered-InRelease; then
            echo 'tampered APT metadata unexpectedly verified' >&2
            exit 1
          fi
          sudo install -m 0644 apt-site/helixir-archive-keyring.gpg \
            /usr/share/keyrings/helixir-ci-keyring.gpg
          printf 'deb [signed-by=/usr/share/keyrings/helixir-ci-keyring.gpg] file:%s/apt-site stable main\n' \
            "$PWD" | sudo tee /etc/apt/sources.list.d/helixir-ci.list >/dev/null
          sudo apt-get update >/dev/null
          sudo apt-get install -y helixir=9.9.8 >/dev/null
          test "$(dpkg-query -W -f='${Version}' helixir)" = '9.9.8'
          test "$(helixir --version)" = 'helixir 9.9.8'
          mkdir -p "$HOME/.helixir" && touch "$HOME/.helixir/preserve-me"
          sudo apt-get install --only-upgrade -y helixir >/dev/null
          test "$(dpkg-query -W -f='${Version}' helixir)" = '9.9.9'
          test "$(helixir --version)" = 'helixir 9.9.9'
          test -f "$HOME/.helixir/preserve-me"
          sudo apt-get install -y helixir-client >/dev/null
          test "$(helixir-client --version)" = 'helixir-client 9.9.9'
          helixir-client connect --help >/dev/null
          sudo apt-get purge -y helixir-client >/dev/null
          sudo apt-get purge -y helixir >/dev/null
          test -f "$HOME/.helixir/preserve-me"

  web:
    name: control-plane frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helixir/web/package-lock.json
      - name: Build production frontend
        working-directory: helixir/web
        run: npm ci && npm test && npm run build
      - name: Install release-gate browser
        working-directory: helixir/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser E2E, RBAC denial, accessibility and polling soak
        working-directory: helixir/web
        run: npm run test:e2e
      - name: Audit production dependencies
        working-directory: helixir/web
        run: npm audit --omit=dev --audit-level=high
      - name: Validate managed Compose stack
        run: docker compose -f helixir/docker-compose.yml config --quiet

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixir-client
          key: rustdoc
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --manifest-path helixir/Cargo.toml --no-deps --document-private-items
          cargo doc --manifest-path helixir-client/Cargo.toml --no-deps --document-private-items

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixir-client
          key: clippy
      # #117: the warning backlog is zero. New rustc or Clippy warnings fail
      # before they can become an accepted baseline.
      - name: cargo clippy
        run: |
          cargo clippy --manifest-path helixir/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path helixir-client/Cargo.toml --all-targets -- -D warnings

  test:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixir-client
          key: test-${{ matrix.os }}
      - name: Fetch ONNX Runtime (macOS)
        if: matrix.ort_url
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o ort-archive "${{ matrix.ort_url }}"
          echo "${{ matrix.ort_sha }}  ort-archive" | shasum -a 256 -c -
          tar xzf ort-archive
          echo "ORT_LIB_LOCATION=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
      - name: cargo build
        working-directory: helixir
        run: cargo build --all-targets --locked || cargo build --all-targets
      - name: install and verify required NLI model
        working-directory: helixir
        run: ./target/debug/helixir model download
      - name: cargo test --lib
        working-directory: helixir
        run: cargo test --lib --locked || cargo test --lib
      - name: helixir-client tests
        working-directory: helixir-client
        run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NLI is required in every build; ort sets the crate-wide Rust floor.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixir-client
            helixdb-mock
          key: msrv
      - name: cargo check
        run: |
          cargo check --manifest-path helixir/Cargo.toml --all-targets
          cargo check --manifest-path helixir-client/Cargo.toml --all-targets
          cargo check --manifest-path helixdb-mock/Cargo.toml --all-targets
