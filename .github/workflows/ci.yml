name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Reduce link/codegen pressure on CI runners.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        working-directory: helixir
        run: cargo fmt --all -- --check

  docs-lint:
    name: docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # #85: catches the drift classes that shipped on 2026-07-04 — stale
      # TOC anchors/order, wrong "N tools" claims, a release without a
      # migration note. Milliseconds, no dependencies.
      - name: docs lint
        run: python3 .github/scripts/docs_lint.py

  web:
    name: control-plane frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helixir/web/package-lock.json
      - name: Build production frontend
        working-directory: helixir/web
        run: npm ci && npm test && npm run build
      - name: Install release-gate browser
        working-directory: helixir/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser E2E, RBAC denial, accessibility and polling soak
        working-directory: helixir/web
        run: npm run test:e2e
      - name: Audit production dependencies
        working-directory: helixir/web
        run: npm audit --omit=dev --audit-level=high
      - name: Validate managed Compose stack
        run: docker compose -f helixir/docker-compose.yml config --quiet

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixir
          key: rustdoc
      - name: cargo doc
        working-directory: helixir
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixir
          key: clippy
      # #117: the warning backlog is zero. New rustc or Clippy warnings fail
      # before they can become an accepted baseline.
      - name: cargo clippy
        working-directory: helixir
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixir
          key: test-${{ matrix.os }}
      - name: Fetch ONNX Runtime (macOS)
        if: matrix.ort_url
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o ort-archive "${{ matrix.ort_url }}"
          echo "${{ matrix.ort_sha }}  ort-archive" | shasum -a 256 -c -
          tar xzf ort-archive
          echo "ORT_LIB_LOCATION=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
      - name: cargo build
        working-directory: helixir
        run: cargo build --all-targets --locked || cargo build --all-targets
      - name: install and verify required NLI model
        working-directory: helixir
        run: ./target/debug/helixir model download
      - name: cargo test --lib
        working-directory: helixir
        run: cargo test --lib --locked || cargo test --lib

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NLI is required in every build; ort sets the crate-wide Rust floor.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixir
          key: msrv
      - name: cargo check
        working-directory: helixir
        run: cargo check --all-targets
