name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux artifacts are built against the Ubuntu 22.04 ABI baseline so the
    # same archive works on Debian 12 and current Ubuntu LTS releases. A null
    # matrix value leaves native macOS/Windows jobs on their host runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: ubuntu:22.04
            artifact: helixir-linux-x86_64
            # Full features again (#80): NLI links against Microsoft's
            # official ONNX Runtime release (fetched below, sha-pinned) via
            # ORT_LIB_LOCATION — cdn.pyke.io is out of the critical path and
            # blackholed during the build to prove it. The tarball ships
            # libonnxruntime.so.* next to the binaries (rpath $ORIGIN).
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz
            ort_sha: 43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6
            ort_dir: onnxruntime-linux-x64-1.24.2
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
            artifact: helixir-linux-arm64
            # Native ARM runner + Microsoft's pinned ARM64 runtime: every
            # release artifact includes the mandatory NLI capability.
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-aarch64-1.24.2.tgz
            ort_sha: 6715b3d19965a2a6981e78ed4ba24f17a8c30d2d26420dbed10aac7ceca0085e
            ort_dir: onnxruntime-linux-aarch64-1.24.2
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN

          - target: x86_64-apple-darwin
            os: macos-latest
            container: null
            artifact: helixir-macos-x86_64
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
            rustflags: -C link-arg=-Wl,-rpath,@loader_path

          - target: aarch64-apple-darwin
            os: macos-latest
            container: null
            artifact: helixir-macos-arm64
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
            rustflags: -C link-arg=-Wl,-rpath,@loader_path

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            container: null
            artifact: helixir-windows-x86_64
            ext: .exe
            # Full features again (#80): same MS-release linking as the
            # linux-x86_64 entry; onnxruntime.dll ships next to the exe.
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-win-x64-1.24.2.zip
            ort_sha: 8e3e9c826375352e29cb2614fe44f3d7a4b0ff7b8028ad7a456af9d949a7e8b0
            ort_dir: onnxruntime-win-x64-1.24.2

    steps:
      - name: Install Linux build baseline dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates clang cmake curl git libssl-dev pkg-config python3

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixir
          key: ${{ matrix.target }}

      - name: Fetch ONNX Runtime (NLI link target, #80)
        if: matrix.ort_url
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o ort-archive "${{ matrix.ort_url }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "${{ matrix.ort_sha }}  ort-archive" | shasum -a 256 -c -
          else
            echo "${{ matrix.ort_sha }}  ort-archive" | sha256sum -c -
          fi
          case "${{ matrix.ort_url }}" in
            *.tgz) tar xzf ort-archive ;;
            *.zip) python -m zipfile -e ort-archive . ;;
          esac
          # MSVC's link.exe cannot use git-bash POSIX paths — hand it a
          # Windows-style one (pwd -W). Linux keeps plain $PWD.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ORT_LIB_LOCATION=$(pwd -W)/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          else
            echo "ORT_LIB_LOCATION=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          fi
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      # The whole point of #80: the build must succeed with the third-party
      # CDN unreachable. Blackhole it so a regression fails loudly here, not
      # during the next outage.
      - name: Blackhole cdn.pyke.io (Linux)
        if: matrix.ort_url && runner.os == 'Linux'
        run: echo "127.0.0.1 cdn.pyke.io" >> /etc/hosts
      - name: Blackhole cdn.pyke.io (Windows)
        if: matrix.ort_url && runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path C:\Windows\System32\drivers\etc\hosts -Value "127.0.0.1 cdn.pyke.io"

      - name: Build release binaries
        working-directory: helixir
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags || '' }}

      - name: Package artifacts
        shell: bash
        working-directory: helixir
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/helixir${{ matrix.ext || '' }} dist/
          cp target/${{ matrix.target }}/release/helixir-mcp${{ matrix.ext || '' }} dist/
          cp target/${{ matrix.target }}/release/helixir-deploy${{ matrix.ext || '' }} dist/
          cp -r schema dist/
          cp helix.toml dist/
          cp -r skills dist/
          # #80: full-feature artifacts carry the ONNX Runtime next to the
          # binaries (linux links with rpath $ORIGIN; windows finds the DLL
          # in the exe directory). Keep them together when relocating.
          if [ -n "${ORT_LIB_LOCATION:-}" ]; then
            cp -a "$ORT_LIB_LOCATION"/libonnxruntime*.so* dist/ 2>/dev/null || true
            cp -a "$ORT_LIB_LOCATION"/libonnxruntime*.dylib dist/ 2>/dev/null || true
            cp "$ORT_LIB_LOCATION"/onnxruntime.dll dist/ 2>/dev/null || true
          fi
          cd dist
          tar -czvf ../${{ matrix.artifact }}.tar.gz *

      - name: Enforce Debian-compatible glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        working-directory: helixir
        run: |
          mapfile -t elf_objects < <(find dist -maxdepth 1 -type f \
            \( -name 'helixir*' -o -name 'libonnxruntime*.so*' \) -print)
          test "${#elf_objects[@]}" -ge 4
          ../tools/check_glibc_baseline.sh --max 2.35 "${elf_objects[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: helixir/${{ matrix.artifact }}.tar.gz

  docker:
    name: Build Docker image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: helixir
          - target: control-plane
            image: helixir-control-plane
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./helixir
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    # Tag pushes only: workflow_dispatch runs are build validation, and
    # action-gh-release must never fire from a bare branch ref.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release checksums
        shell: bash
        run: |
          : > artifacts/SHA256SUMS
          while IFS= read -r -d '' file; do
            sha256sum "$file" | sed "s#  .*#  $(basename "$file")#" >> artifacts/SHA256SUMS
          done < <(find artifacts -type f -name '*.tar.gz' -print0)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true

  distribution:
    name: Publish package-manager channels
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/distribution.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
