name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  memory-boundary-contract:
    name: HelixDB emulator and memory harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bind release to faithful real-HelixDB memory evidence
        shell: bash
        run: |
          version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir/Cargo.toml)
          release_tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$release_tag"
          fi
          python3 tools/verify_release_memory_evidence.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --release-tag "$release_tag" \
            --evidence "helixir/doc/$release_tag/memory-evidence.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixdb-mock
            helixdb
          key: release-helixdb-mock
      - name: Verify bounded emulator and fail-closed harness
        run: |
          make check-memory-boundary
          make test-helixdb-fork

      - name: Build the release-mode HelixDB emulator
        run: cargo build --release --locked --manifest-path helixdb-mock/Cargo.toml

      - name: Upload Linux HelixDB emulator
        uses: actions/upload-artifact@v4
        with:
          name: helixdb-mock-linux-x86_64
          path: helixdb-mock/target/release/helixdb-mock

  build:
    name: Build ${{ matrix.target }}
    needs: memory-boundary-contract
    runs-on: ${{ matrix.os }}
    # Linux artifacts are built against the Ubuntu 22.04 ABI baseline so the
    # same archive works on Debian 12 and current Ubuntu LTS releases. A null
    # matrix value leaves native macOS/Windows jobs on their host runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: ubuntu:22.04
            artifact: helixir-linux-x86_64
            # Full features again (#80): NLI links against Microsoft's
            # official ONNX Runtime release (fetched below, sha-pinned) via
            # ORT_LIB_LOCATION — cdn.pyke.io is out of the critical path and
            # blackholed during the build to prove it. The tarball ships
            # libonnxruntime.so.* next to the binaries (rpath $ORIGIN).
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-x64-1.24.2.tgz
            ort_sha: 43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6
            ort_dir: onnxruntime-linux-x64-1.24.2
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
            artifact: helixir-linux-arm64
            # Native ARM runner + Microsoft's pinned ARM64 runtime: every
            # release artifact includes the mandatory NLI capability.
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-linux-aarch64-1.24.2.tgz
            ort_sha: 6715b3d19965a2a6981e78ed4ba24f17a8c30d2d26420dbed10aac7ceca0085e
            ort_dir: onnxruntime-linux-aarch64-1.24.2
            rustflags: -C link-arg=-Wl,-rpath,$ORIGIN

          - target: x86_64-apple-darwin
            os: macos-latest
            container: null
            artifact: helixir-macos-x86_64
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
            rustflags: -C link-arg=-Wl,-rpath,@loader_path

          - target: aarch64-apple-darwin
            os: macos-latest
            container: null
            artifact: helixir-macos-arm64
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-universal2-1.23.2.tgz
            ort_sha: 49ae8e3a66ccb18d98ad3fe7f5906b6d7887df8a5edd40f49eb2b14e20885809
            ort_dir: onnxruntime-osx-universal2-1.23.2
            rustflags: -C link-arg=-Wl,-rpath,@loader_path

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            container: null
            artifact: helixir-windows-x86_64
            ext: .exe
            # Full features again (#80): same MS-release linking as the
            # linux-x86_64 entry; onnxruntime.dll ships next to the exe.
            flags: ''
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.24.2/onnxruntime-win-x64-1.24.2.zip
            ort_sha: 8e3e9c826375352e29cb2614fe44f3d7a4b0ff7b8028ad7a456af9d949a7e8b0
            ort_dir: onnxruntime-win-x64-1.24.2

    steps:
      - name: Install Linux build baseline dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates clang cmake curl git libssl-dev pkg-config python3

      - uses: actions/checkout@v4

      - name: Require the tag to match every shipped manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          server_version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir/Cargo.toml)
          client_version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir-client/Cargo.toml)
          web_version=$(awk -F '"' '/"version"[[:space:]]*:/ {print $4; exit}' helixir/web/package.json)
          test "$GITHUB_REF_NAME" = "v$server_version"
          test "$client_version" = "$server_version"
          test "$web_version" = "$server_version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixir-client
          key: ${{ matrix.target }}

      - name: Fetch ONNX Runtime (NLI link target, #80)
        if: matrix.ort_url
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o ort-archive "${{ matrix.ort_url }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "${{ matrix.ort_sha }}  ort-archive" | shasum -a 256 -c -
          else
            echo "${{ matrix.ort_sha }}  ort-archive" | sha256sum -c -
          fi
          case "${{ matrix.ort_url }}" in
            *.tgz) tar xzf ort-archive ;;
            *.zip) python -m zipfile -e ort-archive . ;;
          esac
          # MSVC's link.exe cannot use git-bash POSIX paths — hand it a
          # Windows-style one (pwd -W). Linux keeps plain $PWD.
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ORT_LIB_LOCATION=$(pwd -W)/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          else
            echo "ORT_LIB_LOCATION=$PWD/${{ matrix.ort_dir }}/lib" >> "$GITHUB_ENV"
          fi
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      # The whole point of #80: the build must succeed with the third-party
      # CDN unreachable. Blackhole it so a regression fails loudly here, not
      # during the next outage.
      - name: Blackhole cdn.pyke.io (Linux)
        if: matrix.ort_url && runner.os == 'Linux'
        run: echo "127.0.0.1 cdn.pyke.io" >> /etc/hosts
      - name: Blackhole cdn.pyke.io (Windows)
        if: matrix.ort_url && runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path C:\Windows\System32\drivers\etc\hosts -Value "127.0.0.1 cdn.pyke.io"

      - name: Build release binaries
        shell: bash
        working-directory: helixir
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.flags || '' }}
          cargo build --release --locked --manifest-path ../helixir-client/Cargo.toml \
            --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        working-directory: helixir
        run: |
          mkdir -p dist client-dist
          cp target/${{ matrix.target }}/release/helixir${{ matrix.ext || '' }} dist/
          cp target/${{ matrix.target }}/release/helixir-mcp${{ matrix.ext || '' }} dist/
          cp target/${{ matrix.target }}/release/helixir-deploy${{ matrix.ext || '' }} dist/
          cp -r schema dist/
          cp helix.toml dist/
          cp -r skills dist/
          cp -r ../integration dist/
          cp ../helixir-client/target/${{ matrix.target }}/release/helixir-client${{ matrix.ext || '' }} client-dist/
          cp -r skills client-dist/
          cp -r ../integration client-dist/
          # #80: full-feature artifacts carry the ONNX Runtime next to the
          # binaries (linux links with rpath $ORIGIN; windows finds the DLL
          # in the exe directory). Keep them together when relocating.
          if [ -n "${ORT_LIB_LOCATION:-}" ]; then
            cp -a "$ORT_LIB_LOCATION"/libonnxruntime*.so* dist/ 2>/dev/null || true
            cp -a "$ORT_LIB_LOCATION"/libonnxruntime*.dylib dist/ 2>/dev/null || true
            cp "$ORT_LIB_LOCATION"/onnxruntime.dll dist/ 2>/dev/null || true
          fi
          tar -C dist -czvf ${{ matrix.artifact }}.tar.gz .
          client_artifact=${{ matrix.artifact }}
          client_artifact=${client_artifact/#helixir-/helixir-client-}
          tar -C client-dist -czvf "$client_artifact.tar.gz" .

      - name: Enforce Debian-compatible glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        working-directory: helixir
        run: |
          mapfile -t elf_objects < <(find dist client-dist -maxdepth 1 -type f \
            \( -name 'helixir*' -o -name 'libonnxruntime*.so*' \) -print)
          test "${#elf_objects[@]}" -ge 5
          ../tools/check_glibc_baseline.sh --max 2.35 "${elf_objects[@]}"

      - name: Prepare architecture-native NLI model for containers
        if: runner.os == 'Linux'
        shell: bash
        working-directory: helixir
        env:
          HOME: ${{ runner.temp }}/helixir-nli-home
        run: |
          LD_LIBRARY_PATH="$ORT_LIB_LOCATION" ./dist/helixir model download
          tar -C "$HOME/.helixir/models/nli" -czf nli-model.tgz .

      - name: Upload architecture-native NLI model
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nli-${{ matrix.artifact }}
          path: helixir/nli-model.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: helixir/*.tar.gz

  client-quality-gate:
    name: APT, concurrent clients and RBAC visibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            helixir
            helixdb
          key: pre-release-client-gate

      - name: Build maintained HelixDB v2 CLI
        run: |
          cargo build --release --locked --manifest-path helixdb/Cargo.toml -p helix-cli
          test "$(helixdb/target/release/helix --version)" = 'Helix CLI 2.3.5'

      - name: Download Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: helixir-linux-x86_64
          path: release

      - name: Validate canonical live E2E manifest
        run: make test-e2e-manifest

      - name: Verify Docker gate fail-closed diagnostics
        run: |
          make test-pre-release-client-preflight
          make test-dogfood-candidate-preflight

      - name: Run the disposable remote-client gate
        env:
          # GitHub-hosted runners are single-job, throwaway Docker daemons.
          HELIXIR_CLIENT_GATE_DISPOSABLE_DOCKER: '1'
        run: |
          version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir/Cargo.toml)
          tools/pre_release_client_gate.sh \
            --archive release/helixir-linux-x86_64.tar.gz \
            --client-archive release/helixir-client-linux-x86_64.tar.gz \
            --version "$version" --arch amd64

  gateway-linux-systemd:
    name: Linux archive gateway survives systemd user restart
    runs-on: ubuntu-latest
    needs: [build, memory-boundary-contract]
    steps:
      - uses: actions/checkout@v4

      - name: Download promoted Linux release archive
        uses: actions/download-artifact@v4
        with:
          name: helixir-linux-x86_64
          path: release

      - name: Download bounded HelixDB emulator
        uses: actions/download-artifact@v4
        with:
          name: helixdb-mock-linux-x86_64
          path: release/mock

      - name: Run privileged Ubuntu systemd lifecycle gate
        run: |
          tools/gateway_systemd_gate.sh \
            --archive release/helixir-linux-x86_64.tar.gz \
            --mock release/mock/helixdb-mock

  homebrew-preflight:
    name: Homebrew native install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            os: macos-15
          - name: Intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Download unpublished release archives
        uses: actions/download-artifact@v4
        with:
          pattern: helixir-*
          path: downloaded

      - name: Render formula against local immutable artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/helixir-assets" "$RUNNER_TEMP/Formula"
          for asset in \
            helixir-macos-arm64.tar.gz helixir-macos-x86_64.tar.gz \
            helixir-linux-arm64.tar.gz helixir-linux-x86_64.tar.gz \
            helixir-client-macos-arm64.tar.gz helixir-client-macos-x86_64.tar.gz \
            helixir-client-linux-arm64.tar.gz helixir-client-linux-x86_64.tar.gz; do
            source=$(find downloaded -type f -name "$asset" -print -quit)
            test -n "$source"
            cp "$source" "$RUNNER_TEMP/helixir-assets/$asset"
          done
          test "$(find "$RUNNER_TEMP/helixir-assets" -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 8
          python3 tools/backend_release.py inject \
            --repo-root "$GITHUB_WORKSPACE" \
            --artifacts-root "$RUNNER_TEMP/helixir-assets" \
            --image-repository ghcr.io/example/helixir-helixdb \
            --image-digest aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --source-url https://example.invalid/helixir-helixdb-source.tar.gz \
            --source-sha256 bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --fork-revision "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/helixir-assets" && shasum -a 256 *.tar.gz >SHA256SUMS)
          version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir/Cargo.toml)
          python3 tools/render_homebrew_formula.py \
            --tag "v$version" \
            --base-url "file://$RUNNER_TEMP/helixir-assets" \
            --checksums "$RUNNER_TEMP/helixir-assets/SHA256SUMS" \
            --output "$RUNNER_TEMP/Formula/helixir.rb"
          python3 tools/render_homebrew_formula.py \
            --tag "v$version" \
            --base-url "file://$RUNNER_TEMP/helixir-assets" \
            --checksums "$RUNNER_TEMP/helixir-assets/SHA256SUMS" \
            --package helixir-client \
            --output "$RUNNER_TEMP/Formula/helixir-client.rb"
          ruby -c "$RUNNER_TEMP/Formula/helixir.rb"
          ruby -c "$RUNNER_TEMP/Formula/helixir-client.rb"

      - name: Install, test, reinstall and remove through Homebrew
        run: |
          cleanup() {
            brew uninstall --force helixir/pre-release/helixir-client >/dev/null 2>&1 || true
            brew uninstall --force helixir/pre-release/helixir >/dev/null 2>&1 || true
            brew untap helixir/pre-release >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          brew tap-new helixir/pre-release
          tap_dir=$(brew --repository helixir/pre-release)
          cp "$RUNNER_TEMP/Formula/helixir.rb" "$tap_dir/Formula/helixir.rb"
          cp "$RUNNER_TEMP/Formula/helixir-client.rb" "$tap_dir/Formula/helixir-client.rb"
          brew install helixir/pre-release/helixir helixir/pre-release/helixir-client
          server_prefix=$(brew --prefix helixir/pre-release/helixir)
          client_prefix=$(brew --prefix helixir/pre-release/helixir-client)
          version=$(awk -F '"' '/^version[[:space:]]*=/ {print $2; exit}' helixir/Cargo.toml)
          test "$("$server_prefix/bin/helixir" --version)" = "helixir $version"
          "$server_prefix/bin/helixir" onboard --help >/dev/null
          test ! -e "$server_prefix/bin/helixir-client"
          test -f "$server_prefix/libexec/schema/schema.hx"
          test -f "$server_prefix/libexec/skills/helixir-memory/SKILL.md"
          test -f "$server_prefix/libexec/integration/AGENTS.md"
          test -f "$server_prefix/libexec/integration/SKILLS.md"
          test -f "$server_prefix/libexec/backend-image.json"
          test "$("$client_prefix/bin/helixir-client" --version)" = "helixir-client $version"
          "$client_prefix/bin/helixir-client" connect --help >/dev/null
          "$client_prefix/bin/helixir-client" doctor --help >/dev/null
          test ! -e "$client_prefix/libexec/helixir"
          test ! -e "$client_prefix/libexec/schema"
          test ! -e "$client_prefix/libexec/backend-image.json"
          mkdir -p "$HOME/.helixir"
          touch "$HOME/.helixir/pre-release-preserve"
          brew test helixir/pre-release/helixir
          brew test helixir/pre-release/helixir-client
          brew reinstall helixir/pre-release/helixir
          brew reinstall helixir/pre-release/helixir-client
          test -f "$HOME/.helixir/pre-release-preserve"
          brew uninstall helixir/pre-release/helixir-client
          brew uninstall helixir/pre-release/helixir
          brew untap helixir/pre-release
          test -f "$HOME/.helixir/pre-release-preserve"
          trap - EXIT

  web-assets:
    name: Build control-plane web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: helixir/web/package-lock.json
      - name: Build frontend once
        working-directory: helixir/web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: helixir-web-dist
          path: helixir/web/dist

  docker-platform:
    name: Package Docker images (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    needs: [build, web-assets, client-quality-gate, gateway-linux-systemd, homebrew-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            artifact: helixir-linux-x86_64
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            artifact: helixir-linux-arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download native release archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: helixir/release/archive

      - name: Download architecture-native NLI model
        uses: actions/download-artifact@v4
        with:
          name: nli-${{ matrix.artifact }}
          path: helixir/release/model

      - name: Download shared web assets
        uses: actions/download-artifact@v4
        with:
          name: helixir-web-dist
          path: helixir/release/web

      - name: Prepare packaging context
        shell: bash
        run: |
          mkdir -p helixir/release/payload helixir/release/nli
          tar xzf "helixir/release/archive/${{ matrix.artifact }}.tar.gz" \
            -C helixir/release/payload
          tar xzf helixir/release/model/nli-model.tgz -C helixir/release/nli
          test -x helixir/release/payload/helixir
          test -x helixir/release/payload/helixir-mcp
          test -f helixir/release/nli/model.onnx
          test -f helixir/release/web/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push runtime architecture
        uses: docker/build-push-action@v5
        with:
          context: ./helixir
          target: release-runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/helixir:sha-${{ github.sha }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-runtime-${{ matrix.arch }}

      - name: Package and push control-plane architecture
        uses: docker/build-push-action@v5
        with:
          context: ./helixir
          target: release-control-plane
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/helixir-control-plane:sha-${{ github.sha }}-${{ matrix.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-control-plane-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-control-plane-${{ matrix.arch }}

  dogfood-candidate-images:
    name: Export disposable ARM64 dogfood candidates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    needs: [build, web-assets, client-quality-gate, gateway-linux-systemd, homebrew-preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixdb
          key: dogfood-helixdb-v2

      - name: Build maintained HelixDB v2 CLI
        run: |
          cargo build --release --locked --manifest-path helixdb/Cargo.toml -p helix-cli
          test "$(helixdb/target/release/helix --version)" = 'Helix CLI 2.3.5'

      - uses: actions/download-artifact@v4
        with:
          name: helixir-linux-arm64
          path: helixir/release/archive

      - uses: actions/download-artifact@v4
        with:
          name: helixir-web-dist
          path: helixir/release/web

      - name: Prepare release-shaped control-plane context
        run: |
          mkdir -p helixir/release/payload
          tar xzf helixir/release/archive/helixir-linux-arm64.tar.gz \
            -C helixir/release/payload
          test -x helixir/release/payload/helixir
          test -f helixir/release/web/index.html

      - name: Compile the exact candidate schema
        working-directory: helixir
        env:
          HELIX_REPO_PATH: ${{ github.workspace }}/helixdb
        run: |
          ../helixdb/target/release/helix check
          ../helixdb/target/release/helix build -i dev --quiet
          test -s .helix/dev/Dockerfile

      - name: Build and export candidate images
        working-directory: helixir
        run: |
          docker image inspect helix-helixir-dev:latest >/dev/null
          docker tag helix-helixir-dev:latest "helix-helixir-candidate:${GITHUB_SHA}"
          docker build --target release-control-plane \
            --tag "helixir-control-plane-candidate:${GITHUB_SHA}" .
          docker save "helix-helixir-candidate:${GITHUB_SHA}" | gzip -1 \
            >helixdb-candidate-arm64.tar.gz
          docker save "helixir-control-plane-candidate:${GITHUB_SHA}" | gzip -1 \
            >control-plane-candidate-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dogfood-candidate-images-arm64
          path: |
            helixir/helixdb-candidate-arm64.tar.gz
            helixir/control-plane-candidate-arm64.tar.gz
          retention-days: 1

  helixdb-platform:
    name: Package maintained HelixDB (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    needs: [build, memory-boundary-contract]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helixdb
          key: release-helixdb-${{ matrix.arch }}

      - name: Build maintained compiler and exact schema image
        run: |
          cargo build --release --locked --manifest-path helixdb/Cargo.toml -p helix-cli
          test "$(helixdb/target/release/helix --version)" = 'Helix CLI 2.3.5'
          cd helixir
          HELIX_REPO_PATH="$GITHUB_WORKSPACE/helixdb" ../helixdb/target/release/helix check
          HELIX_REPO_PATH="$GITHUB_WORKSPACE/helixdb" ../helixdb/target/release/helix build -i dev --quiet
          docker image inspect helix-helixir-dev:latest >/dev/null

      - name: Read immutable backend metadata
        id: backend
        shell: bash
        run: |
          engine_revision=$(sed -n 's/^pub const ENGINE_REVISION: &str = "\([^"]*\)";/\1/p' helixir/src/installer/backend.rs)
          upstream_revision=$(sed -n 's/^pub const UPSTREAM_REVISION: &str = "\([^"]*\)";/\1/p' helixir/src/installer/backend.rs)
          schema_fingerprint=$(python3 tools/backend_release.py fingerprint --schema-dir helixir/schema)
          test -n "$engine_revision"
          test -n "$upstream_revision"
          test -n "$schema_fingerprint"
          echo "engine_revision=$engine_revision" >> "$GITHUB_OUTPUT"
          echo "upstream_revision=$upstream_revision" >> "$GITHUB_OUTPUT"
          echo "schema_fingerprint=$schema_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Label and push maintained backend architecture
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
          ENGINE_REVISION: ${{ steps.backend.outputs.engine_revision }}
          SCHEMA_FINGERPRINT: ${{ steps.backend.outputs.schema_fingerprint }}
          UPSTREAM_REVISION: ${{ steps.backend.outputs.upstream_revision }}
        run: |
          image="ghcr.io/$OWNER/helixir-helixdb:sha-$GITHUB_SHA-$ARCH"
          docker build \
            --file helixdb/helixir-release.Dockerfile \
            --build-arg BASE_IMAGE=helix-helixir-dev:latest \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg ENGINE_REVISION="$ENGINE_REVISION" \
            --build-arg SCHEMA_FINGERPRINT="$SCHEMA_FINGERPRINT" \
            --build-arg UPSTREAM_REVISION="$UPSTREAM_REVISION" \
            --tag "$image" .
          test "$(docker image inspect --format '{{ index .Config.Labels \"io.helixir.engine-revision\" }}' "$image")" = "$ENGINE_REVISION"
          test "$(docker image inspect --format '{{ index .Config.Labels \"io.helixir.schema-fingerprint\" }}' "$image")" = "$SCHEMA_FINGERPRINT"
          docker push "$image"

  docker-manifest:
    name: Publish multi-arch Docker manifests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [docker-platform, helixdb-platform]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable manifests
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          for image in helixir helixir-control-plane helixir-helixdb; do
            docker buildx imagetools create \
              --tag "ghcr.io/$OWNER/$image:$TAG" \
              "ghcr.io/$OWNER/$image:sha-$SHA-amd64" \
              "ghcr.io/$OWNER/$image:sha-$SHA-arm64"
          done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, docker-manifest, gateway-linux-systemd]
    # Tag pushes only: workflow_dispatch runs are build validation, and
    # action-gh-release must never fire from a bare branch ref.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bind server archives to the maintained backend
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image_repository="ghcr.io/$OWNER/helixir-helixdb"
          image_digest=$(docker buildx imagetools inspect \
            "$image_repository:$GITHUB_REF_NAME" \
            | awk '$1 == "Digest:" { sub(/^sha256:/, "", $2); print $2; exit }')
          test "${#image_digest}" = 64
          docker buildx imagetools inspect \
            "$image_repository@sha256:$image_digest" >/dev/null

          source_name="helixir-helixdb-source-$GITHUB_REF_NAME.tar.gz"
          git archive --format=tar \
            --prefix="helixir-helixdb-source-$GITHUB_REF_NAME/" \
            "$GITHUB_SHA" helixdb helixir/schema helixir/helix.toml \
            | gzip -n > "artifacts/$source_name"
          source_sha256=$(sha256sum "artifacts/$source_name" | cut -d' ' -f1)
          source_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$source_name"

          python3 tools/backend_release.py inject \
            --repo-root "$GITHUB_WORKSPACE" \
            --artifacts-root artifacts \
            --image-repository "$image_repository" \
            --image-digest "$image_digest" \
            --source-url "$source_url" \
            --source-sha256 "$source_sha256" \
            --fork-revision "$GITHUB_SHA" \
            --output artifacts/backend-image.json

          server_archives=0
          while IFS= read -r -d '' archive; do
            test "$(tar -tzf "$archive" | sed 's#^\./##' | grep -cx 'backend-image.json')" = 1
            server_archives=$((server_archives + 1))
          done < <(find artifacts -type f \
            \( -name 'helixir-linux-*.tar.gz' -o -name 'helixir-macos-*.tar.gz' \
              -o -name 'helixir-windows-*.tar.gz' \) -print0)
          test "$server_archives" = 5

          client_archives=0
          while IFS= read -r -d '' archive; do
            ! tar -tzf "$archive" | sed 's#^\./##' | grep -qx 'backend-image.json'
            client_archives=$((client_archives + 1))
          done < <(find artifacts -type f -name 'helixir-client-*.tar.gz' -print0)
          test "$client_archives" = 5

      - name: Create release checksums
        shell: bash
        run: |
          : > artifacts/SHA256SUMS
          while IFS= read -r -d '' file; do
            sha256sum "$file" | sed "s#  .*#  $(basename "$file")#" >> artifacts/SHA256SUMS
          done < <(find artifacts -type f \( -name '*.tar.gz' -o -name 'backend-image.json' \) -print0)

      - name: Load curated release metadata
        id: metadata
        shell: bash
        run: |
          notes="helixir/doc/${GITHUB_REF_NAME}/notes.md"
          test -f "$notes"
          title=$(sed -n '1s/^# //p' "$notes")
          test -n "$title"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/backend-image.json
            artifacts/SHA256SUMS
          name: ${{ steps.metadata.outputs.title }}
          body_path: ${{ steps.metadata.outputs.notes }}
          make_latest: true

  distribution:
    name: Publish package-manager channels
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/distribution.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  docker-latest:
    name: Promote Docker latest tags
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote released immutable manifests
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          for image in helixir helixir-control-plane helixir-helixdb; do
            docker buildx imagetools create \
              --tag "ghcr.io/$OWNER/$image:latest" \
              "ghcr.io/$OWNER/$image:$TAG"
          done
