[package]
name = "helixir-client"
version = "0.17.2"
edition = "2024"
rust-version = "1.88"
description = "Thin remote-agent bootstrapper for a Helixir MCP gateway"
license = "MIT"
repository = "https://github.com/nikita-rulenko/Helixir"

[[bin]]
name = "helixir-client"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"

[dev-dependencies]
tempfile = "3.20"
